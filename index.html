<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una nota para ti</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <section class="card">
            <h1>Una nota para ti</h1>

            <p>
                Ingresa el código para continuar
            </p>

            <input
                type="password"
                id="password"
                placeholder="Código"
                autocomplete="off"
            >

            <button id="open-note">
                Abrir nota
            </button>

            <p id="message"></p>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
